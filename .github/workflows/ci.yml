name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Home Assistant ships monthly and deprecates briskly. A weekly run means
    # a breaking change upstream is found here rather than in somebody's
    # garage at six in the morning.
    - cron: "17 4 * * 1"

jobs:
  agent:
    name: agent (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The box runs 3.11. The agent must keep working there, so that is
          # the floor the tests run against, not whatever is newest.
          python-version: "3.11"
      - run: python -m unittest discover -s box/tests -v
      - name: the agent must not grow a dependency
        run: |
          # Column zero on purpose. paho is imported inside MqttPublisher so
          # that MQTT stays optional, and an indent-tolerant pattern flagged
          # exactly the deliberate lazy import this rule exists to permit.
          ! grep -nE '^import (paho|aiohttp|requests|yaml)|^from (paho|aiohttp|requests|yaml)' \
            box/carplay_wan_agent.py \
            || { echo "a top-level third-party import crept in"; exit 1; }

  integration:
    name: integration (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q --cov-fail-under=95

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck box/probe/headunit-probe.sh
