name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  agent:
    name: agent and probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The box runs 3.11. Everything here has to keep working there, so
          # that is the floor the tests run against, not whatever is newest.
          python-version: "3.11"
      - run: python -m unittest discover -s box/tests -v
      - name: nothing here may grow a dependency
        run: |
          # Column zero on purpose: paho is imported inside MqttPublisher so
          # that MQTT stays optional, and an indent-tolerant pattern flagged
          # exactly the deliberate lazy import this rule exists to permit.
          ! grep -nE '^import (paho|aiohttp|requests|yaml)|^from (paho|aiohttp|requests|yaml)' \
            box/carplay_wan_agent.py box/probe/headunit_probe.py \
            || { echo "a top-level third-party import crept in"; exit 1; }
      - name: both tools must run offline
        run: |
          python box/probe/headunit_probe.py A --dry-run > /dev/null
          python box/probe/headunit_probe.py A --head-unit --dry-run > /dev/null
